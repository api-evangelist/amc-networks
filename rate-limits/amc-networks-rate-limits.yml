description: >-
  AMC Global Media documents NO API rate limits, quotas, throttling behaviour or
  rate-limit response headers, because it publishes no public API. There is no
  developer portal, no API reference and no machine-readable contract on any host
  the company controls, so there is nothing to rate limit and nothing published to
  record. limit_count is 0 as an honest measured zero.
notes: >-
  If AMC Global Media ever publishes a partner or advertising API, the values worth
  capturing are the per-key window and limit, the burst allowance, the exhaustion
  status code, and the RateLimit-* / Retry-After response headers. None of those are
  published today.

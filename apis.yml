  - type: Features
    data:
      - name: Audience+ Data Platform
        description: >-
          Proprietary data platform for creating audience segments and reaching
          viewers across linear and streaming properties with targeted advertising.
          Accessed through AMC ad sales, not through a self-serve API.
      - name: AMCN Outcomes
        description: >-
          Outcome-based advertising measurement product enabling brands to gauge
          consumer response to ad spending across AMC Global Media properties.
      - name: FAST Channels
        description: >-
          33 free ad-supported streaming television channels distributed across
          22 platforms, providing digital advertising inventory.
      - name: Streaming Services
        description: >-
          AMC+, Acorn TV, Shudder, Sundance Now, HIDIVE and ALLBLK subscription
          streaming services. HIDIVE runs on the third-party DICE platform
          (dce-frontoffice.imggaming.com), so its runtime API belongs to that
          vendor rather than to AMC.
      - name: Affiliate Portal
        description: >-
          Login-gated partner portal providing marketing materials, key art,
          promotional videos, social toolkits, legal certifications, and technical
          launch documents for cable and streaming distribution partners.
      - name: Broadcasting and Technology Services
        description: >-
          Program origination, encoding, satellite uplinking and studio production
          for AMC and third-party networks; transmission requests are handled
          through a credentialed operations portal, not an API.
      - name: Contextual AI Advertising
        description: >-
          AI-powered content indexing of AMC's original content library enabling
          contextual ad placement adjacent to relevant scenes.
  - type: UseCases
    data:
      - name: Cable and Streaming Affiliate Distribution
        description: >-
          Distributors access marketing and technical resources for AMC channel
          launches and affiliate partnerships through the gated affiliate portal.
      - name: Digital Advertising
        description: >-
          Advertisers reach audiences across AMC's linear, FAST and streaming
          properties using Audience+ targeting and AMCN Outcomes measurement.
      - name: Content Licensing and Streaming Distribution
        description: >-
          Platforms and international broadcasters license AMC Studios and AMC
          Networks International content and FAST channel feeds.
  - type: Integrations
    data:
      - name: Netflix
        description: >-
          Expanded global streaming licensing relationship announced with AMC's
          Q2 2026 results, bringing AMC titles to Netflix.
      - name: Fandango
        description: >-
          AMC expanded its advertising initiative to theatrical moviegoing via a
          partnership with Fandango.
      - name: Runway
        description: >-
          AI partnership with Runway for content creation and advertising
          enhancement capabilities.
      - name: DICE (IMG Arena)
        description: >-
          HIDIVE's streaming delivery runs on the third-party DICE platform, a
          vendor-operated surface rather than an AMC-published API.

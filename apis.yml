aid: amc-networks
name: AMC Global Media
description: >-
  AMC Global Media Inc. (NASDAQ: AMCX), known as AMC Networks until its 2026
  rebrand, is a global entertainment company that owns and operates AMC, BBC
  America, IFC, SundanceTV and We TV, the AMC+, Acorn TV, Shudder, Sundance Now,
  HIDIVE and ALLBLK streaming services, AMC Studios, IFC Films and AMC Networks
  International. It distributes 33 FAST channels across 22 platforms and sells
  advertising through its Audience+ audience data platform and AMCN Outcomes
  measurement product. The company publishes no public developer program and no
  machine-readable API contract: affiliate distribution runs through a login-gated
  partner portal, advertising is booked through sales, and broadcast delivery is
  contracted through its Broadcasting & Technology group. The legacy domain
  www.amcnetworks.com now redirects to www.amcglobalmedia.com.

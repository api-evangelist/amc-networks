apis:
  - aid: amc-networks:amc-networks
    name: AMC Global Media
    description: >-
      AMC Global Media delivers entertainment content through cable networks,
      FAST channels and subscription streaming platforms. There is no public API,
      developer portal or machine-readable contract. Affiliate partners access
      marketing materials, key art, social toolkits, legal certifications and
      technical launch documents through a login-gated affiliate portal.
      Advertisers engage through the Connect ad-sales route, using the Audience+
      data platform for segmentation and AMCN Outcomes for campaign measurement.
      Broadcast origination, encoding and satellite delivery are contracted
      through AMC Broadcasting & Technology.

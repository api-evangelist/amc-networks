description: >-
  AMC Global Media publishes NO API plans and NO API pricing of any kind. Its full
  public page inventory was walked from the WordPress sitemap on 2026-09-02 and
  contains no developer, API, pricing or plans page. Commercial engagement is
  bilateral: affiliate distribution is negotiated through a login-gated partner
  portal, advertising (Audience+ segmentation, AMCN Outcomes measurement) is booked
  through the Connect ad-sales route, and broadcast delivery is contracted through
  AMC B&T Technical Services. plan_count is 0 because the provider publishes zero
  plans, not because none were looked for.
notes: >-
  Consumer subscription pricing for AMC+, Acorn TV, Shudder, HIDIVE and ALLBLK exists
  on the individual streaming brand sites, but that is retail media pricing for
  end viewers — it is not API plan pricing and is deliberately not recorded here.
